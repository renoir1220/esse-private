name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Use owned runners or explicitly fall back to GitHub-hosted runners
        required: true
        default: self
        type: choice
        options:
          - self
          - hosted
      validation_scope:
        description: Run full packaging checks or classify the branch diff automatically
        required: true
        default: full
        type: choice
        options:
          - full
          - auto
      run_macos:
        description: Run the Apple Silicon macOS checks when full validation is required
        required: true
        default: true
        type: boolean

concurrency:
  group: private-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  classify:
    name: Classify validation scope
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest' || fromJSON('["self-hosted","esse-private-windows-x64"]') }}
    outputs:
      full_required: ${{ steps.paths.outputs.full_required }}
      full_validation: ${{ steps.scope.outputs.full_validation }}
      reused_run_id: ${{ steps.reuse.outputs.source_run_id }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve changed paths
        id: paths
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          DISPATCH_SCOPE: ${{ inputs.validation_scope }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:DISPATCH_SCOPE -eq 'full') {
            node scripts/classify-private-ci.mjs --force-full
            exit $LASTEXITCODE
          }
          if ($env:EVENT_NAME -eq 'pull_request') {
            node scripts/classify-private-ci.mjs --base $env:PR_BASE_SHA --head $env:PR_HEAD_SHA
            exit $LASTEXITCODE
          }
          if ($env:EVENT_NAME -eq 'push') {
            node scripts/classify-private-ci.mjs --base $env:PUSH_BASE_SHA --head $env:GITHUB_SHA
            exit $LASTEXITCODE
          }
          git fetch --no-tags origin main
          $base = git merge-base origin/main HEAD
          node scripts/classify-private-ci.mjs --base $base --head HEAD
          exit $LASTEXITCODE
      - name: Resolve checked-out tree
        id: identity
        shell: powershell
        run: |
          $tree = git rev-parse 'HEAD^{tree}'
          "tree=$tree" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Find reusable full validation
        id: reuse
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.paths.outputs.full_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/find-reusable-validation.mjs ${{ steps.identity.outputs.tree }}
      - name: Select validation tier
        id: scope
        shell: powershell
        env:
          FULL_REQUIRED: ${{ steps.paths.outputs.full_required }}
          REUSABLE: ${{ steps.reuse.outputs.reusable }}
          REUSED_RUN_ID: ${{ steps.reuse.outputs.source_run_id }}
        run: |
          $runFull = $env:FULL_REQUIRED -eq 'true' -and $env:REUSABLE -ne 'true'
          "full_validation=$($runFull.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:REUSABLE -eq 'true') {
            Write-Output "Reusing exact-tree full validation from workflow run $env:REUSED_RUN_ID."
          } elseif ($runFull) {
            Write-Output "Full package validation is required."
          } else {
            Write-Output "Fast validation is sufficient for this change set."
          }

  verify-private-overlay:
    name: Verify private inheritance
    needs: classify
    if: needs.classify.outputs.reused_run_id == ''
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest' || fromJSON('["self-hosted","esse-private-windows-x64"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Fetch Community source of truth
        shell: powershell
        run: |
          $upstream = node -p "require('./private-overlay.json').upstream.repository"
          $branch = node -p "require('./private-overlay.json').upstream.branch"
          $remotes = @(git remote)
          if ($remotes -contains 'upstream') {
            git remote set-url upstream $upstream
          } else {
            git remote add upstream $upstream
          }
          $refspec = "+refs/heads/$($branch):refs/remotes/upstream/$($branch)"
          git fetch --no-tags upstream $refspec
      - run: node scripts/verify-private-overlay.mjs upstream/main

  verify-windows:
    name: Verify Windows x64
    needs: classify
    if: needs.classify.outputs.reused_run_id == ''
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest' || fromJSON('["self-hosted","esse-private-windows-x64"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Verify CI and release policy scripts
        shell: powershell
        run: |
          node --test scripts/classify-private-ci.test.mjs scripts/find-reusable-validation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-private-release-pipeline.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $null = [scriptblock]::Create((Get-Content -Raw -Encoding UTF8 .\scripts\publish-private-release.ps1))
          & .\scripts\test-publish-private-release.ps1
          $null = [scriptblock]::Create((Get-Content -Raw -Encoding UTF8 .\install.ps1))
          bash -n ./install.sh
      - name: Install Codex Plugin dependencies
        working-directory: plugins/codex
        run: npm ci
      - name: Verify Codex Plugin source
        working-directory: plugins/codex
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Verify Codex Plugin runtime
        if: needs.classify.outputs.full_validation == 'true'
        working-directory: plugins/codex
        run: |
          npm run selftest
          npm run smoke:stdio
          npm run smoke:multi-stdio
          npm run smoke:core-survival
          npm run smoke:core-crash
          npm run verify:release
      - name: Record Windows cold/warm thumbnail benchmark
        if: needs.classify.outputs.full_validation == 'true'
        working-directory: plugins/codex
        run: npm run benchmark:thumbnails
      - name: Package Windows Codex Plugin
        if: needs.classify.outputs.full_validation == 'true'
        working-directory: plugins/codex
        run: node scripts/package-releases.mjs --target windows-x64
      - name: Run Windows installation user-path E2E
        if: needs.classify.outputs.full_validation == 'true'
        working-directory: plugins/codex
        run: npm run e2e:windows
      - name: Install Agent Sidecar dependencies
        working-directory: sidecars/agent
        run: npm ci
      - name: Verify Agent Sidecar source
        working-directory: sidecars/agent
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build Agent Sidecar installer
        if: needs.classify.outputs.full_validation == 'true'
        working-directory: sidecars/agent
        run: npm run make
      - name: Verify Agent Sidecar installer
        if: needs.classify.outputs.full_validation == 'true'
        working-directory: sidecars/agent
        shell: powershell
        run: |
          npm run verify:icons:windows
          npm run verify:package:windows
          $product = Get-Content -Raw -Encoding UTF8 'product.json' | ConvertFrom-Json
          $installer = Resolve-Path (Join-Path '.\out\make\squirrel.windows\x64' $product.windowsSetupExe)
          if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
            throw "Esse installer is unexpectedly small."
          }

  verify-macos-arm64:
    name: Verify macOS ARM64
    needs: classify
    if: needs.classify.outputs.full_validation == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_macos)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'macos-15' || fromJSON('["self-hosted","esse-private-macos-arm64"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install Agent Sidecar dependencies
        working-directory: sidecars/agent
        run: npm ci
      - name: Verify Agent Sidecar source
        working-directory: sidecars/agent
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build and verify Agent Sidecar
        working-directory: sidecars/agent
        run: |
          npm run make:macos:arm64
          bash scripts/verify-macos-bundle.sh arm64
      - name: Install Codex Plugin dependencies
        working-directory: plugins/codex
        run: npm ci
      - name: Verify Codex Plugin on macOS
        working-directory: plugins/codex
        run: |
          npm run build
          npm run selftest
          npm run benchmark:thumbnails
          node scripts/package-releases.mjs --target macos-arm64
      - name: Verify macOS installer syntax
        run: bash -n ./install.sh
      - name: Verify macOS archive contains only the safe launcher
        shell: bash
        run: |
          archive=(release/esse-macos-arm64-v*.zip)
          test "${#archive[@]}" -eq 1
          extracted="$(mktemp -d)"
          /usr/bin/ditto -x -k "${archive[0]}" "$extracted"
          launcher="$extracted/plugins/esse/bin/esse"
          test -f "$extracted/plugins/esse/mcp/server.cjs"
          /bin/bash -n "$launcher"
          if /usr/bin/file "$launcher" | grep -q 'Mach-O'; then
            echo "macOS package must not contain an Esse-built Mach-O launcher" >&2
            exit 1
          fi
          grep -q '"command": "/bin/bash"' "$extracted/plugins/esse/.mcp.json"
          ESSE_NODE_BIN="$(command -v node)" /bin/bash "$launcher" --self-test
          install_root="$(mktemp -d)/plugin"
          version="$(node -p "require('./plugins/codex/package.json').version")"
          ESSE_INSTALL_ROOT="$install_root" \
            ESSE_CODEX_BIN="$PWD/plugins/codex/test/fixtures/fake-codex.sh" \
            ESSE_NODE_BIN="$(command -v node)" \
            ESSE_FAKE_PLUGIN_VERSION="$version" \
            /bin/bash "$extracted/install.sh"
          grep -q "\"version\": \"$version\"" "$install_root/install-receipt.json"
          installed_widget="$install_root/versions/$version/plugins/esse/mcp/widget.html"
          printf 'corrupt same-version widget' > "$installed_widget"
          mkdir -p "$install_root/versions/0.0.1" "$install_root/versions/0.0.2"
          ESSE_INSTALL_ROOT="$install_root" \
            ESSE_CODEX_BIN="$PWD/plugins/codex/test/fixtures/fake-codex.sh" \
            ESSE_NODE_BIN="$(command -v node)" \
            ESSE_FAKE_PLUGIN_VERSION="$version" \
            /bin/bash "$extracted/install.sh"
          cmp "$installed_widget" "$extracted/plugins/esse/mcp/widget.html"
          test "$(find "$install_root/versions" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" -eq 1

  record-validation:
    name: Record exact-tree PR validation
    needs:
      - classify
      - verify-private-overlay
      - verify-windows
      - verify-macos-arm64
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.verify-private-overlay.result == 'success' &&
      needs.verify-windows.result == 'success' &&
      (
        needs.classify.outputs.full_validation != 'true' ||
        needs.verify-macos-arm64.result == 'success'
      )
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest' || fromJSON('["self-hosted","esse-private-windows-x64"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Create exact-tree validation receipt
        id: receipt
        shell: powershell
        run: |
          $tree = git rev-parse 'HEAD^{tree}'
          $fullValidation = '${{ needs.classify.outputs.full_validation }}' -eq 'true'
          $receipt = @{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            workflowRunId = $env:GITHUB_RUN_ID
            commit = (git rev-parse HEAD)
            tree = $tree
            tier = if ($fullValidation) { 'full' } else { 'fast' }
            targets = if ($fullValidation) {
              @('source', 'windows-x64', 'macos-arm64')
            } else {
              @('source')
            }
          } | ConvertTo-Json
          $receiptPath = Join-Path $env:RUNNER_TEMP 'validation.json'
          $receipt | Set-Content -LiteralPath $receiptPath -Encoding UTF8
          "tree=$tree" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "receipt=$receiptPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: esse-private-validation-${{ steps.receipt.outputs.tree }}
          path: ${{ steps.receipt.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30
