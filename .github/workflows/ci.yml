name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full macOS verification or automatic path classification
        default: full
        required: true
        type: choice
        options: [full, auto]

concurrency:
  group: esse-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  policy:
    name: Inheritance and validation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full_validation: ${{ steps.scope.outputs.full_validation }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Verify Community inheritance
        run: |
          git remote add upstream https://github.com/renoir1220/esse.git
          git fetch --no-tags upstream main
          node scripts/verify-private-overlay.mjs upstream/main
      - name: Test release policy with fake assets
        run: |
          node --test scripts/*.test.mjs
          node scripts/verify-private-release-pipeline.mjs
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          DISPATCH_SCOPE: ${{ inputs.validation_scope }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DISPATCH_SCOPE" == full ]]; then
            node scripts/classify-private-ci.mjs --force-full
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            node scripts/classify-private-ci.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            node scripts/classify-private-ci.mjs --base "$PUSH_BASE_SHA" --head "$GITHUB_SHA"
          else
            node scripts/classify-private-ci.mjs --base "$(git merge-base origin/main HEAD)" --head HEAD
          fi
      - name: Resolve exact tree
        id: identity
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Reuse successful same-repository PR verification
        id: reuse
        if: github.event_name == 'push' && steps.paths.outputs.full_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/find-reusable-validation.mjs ${{ steps.identity.outputs.tree }}
      - name: Select validation tier
        id: scope
        env:
          FULL_REQUIRED: ${{ steps.paths.outputs.full_required }}
          REUSABLE: ${{ steps.reuse.outputs.reusable }}
        run: |
          if [[ "$FULL_REQUIRED" == true && "$REUSABLE" != true ]]; then
            echo 'full_validation=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full_validation=false' >> "$GITHUB_OUTPUT"
          fi

  verify-macos-arm64:
    name: Verify macOS ARM64
    needs: policy
    if: needs.policy.outputs.full_validation == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/codex/package-lock.json
            sidecars/agent/package-lock.json
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Check inherited Plugin source
        working-directory: plugins/codex
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run selftest
          npm run smoke:stdio
          npm run smoke:multi-stdio
          npm run smoke:core-survival
          npm run smoke:core-crash
      - name: Check Sidecar source and thumbnails
        working-directory: sidecars/agent
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run e2e:provider-redirects
          npm run e2e:thumbnails
      - name: Package and smoke-test macOS ARM64
        working-directory: sidecars/agent
        run: |
          npm run make:macos:arm64
          bash scripts/verify-macos-bundle.sh arm64
      - name: Record exact-tree PR validation
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_TREE: ${{ needs.policy.outputs.tree }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/validation.json", JSON.stringify({schemaVersion:2,tree:process.env.EXPECTED_TREE,tier:"full",targets:["macos-arm64"]}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: esse-macos-validation-v2-${{ needs.policy.outputs.tree }}
          path: ${{ runner.temp }}/validation.json
          retention-days: 1
          if-no-files-found: error
