name: Esse desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sidecars/agent
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecars/agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make
      - run: npm run verify:icons:windows
      - run: npm run verify:package:windows

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sidecars/agent
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecars/agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make:macos:${{ matrix.arch }}
      - run: bash scripts/verify-macos-bundle.sh ${{ matrix.arch }}
