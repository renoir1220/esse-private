name: Private downstream inheritance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Fetch Community source of truth
        run: |
          git remote add upstream "$(node -p "require('./private-overlay.json').upstream.repository")"
          git fetch --no-tags upstream "$(node -p "require('./private-overlay.json').upstream.branch")"
      - name: Verify inheritance and private overlay boundary
        run: node scripts/verify-private-overlay.mjs upstream/main
