name: Esse release publish

on:
  workflow_run:
    workflows: ["Esse release build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Esse release build workflow run ID
        required: true
        type: string
      tag:
        description: Existing release tag built by that workflow run
        required: true
        type: string
      runner_mode:
        description: Use the owned Windows publisher or explicitly fall back to GitHub-hosted
        required: true
        default: self
        type: choice
        options:
          - self
          - hosted

concurrency:
  group: private-release-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest' || fromJSON('["self-hosted","esse-private-windows-x64"]') }}
    steps:
      - name: Verify source build workflow
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') {
            throw "Build run ID must be numeric."
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Release tag has an unsupported format: $env:RELEASE_TAG"
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect build workflow run $env:BUILD_RUN_ID."
          }
          if ($run.name -ne 'Esse release build' -or $run.path -ne '.github/workflows/release.yml') {
            throw "Run $env:BUILD_RUN_ID is not an Esse release build."
          }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw "Build workflow run $env:BUILD_RUN_ID did not complete successfully."
          }
          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Build workflow run $env:BUILD_RUN_ID did not originate from $env:GITHUB_REPOSITORY."
          }
          if ($run.event -eq 'push') {
            if ($run.head_branch -ne $env:RELEASE_TAG) {
              throw "Build run ref $($run.head_branch) does not match release tag $env:RELEASE_TAG."
            }
            "BUILD_COMMIT=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($run.event -eq 'workflow_dispatch') {
            $repository = gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.head_branch -ne $repository.default_branch) {
              throw "Recovery build $env:BUILD_RUN_ID must be dispatched from the repository default branch."
            }
          } else {
            throw "Build workflow run $env:BUILD_RUN_ID has unsupported event $($run.event)."
          }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag and build commit
        shell: powershell
        run: |
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($env:BUILD_COMMIT)) {
            "BUILD_COMMIT=$tagCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($tagCommit -ne $env:BUILD_COMMIT) {
            throw "Tag commit $tagCommit does not match immutable build commit $env:BUILD_COMMIT."
          }
          $packageVersion = node -p "require('./sidecars/agent/package.json').version"
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Release tag $env:RELEASE_TAG does not match package version $packageVersion."
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: esse-release-*
          path: release
          merge-multiple: true
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify immutable build provenance
        shell: powershell
        run: node scripts/verify-private-release-provenance.mjs $env:RELEASE_TAG $env:BUILD_COMMIT
      - name: Create checksums and Sidecar metadata
        shell: powershell
        run: node scripts/create-private-release-metadata.mjs $env:RELEASE_TAG
      - name: Publish or safely resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: >-
          .\scripts\publish-private-release.ps1
          -Tag $env:RELEASE_TAG
          -Repository $env:GITHUB_REPOSITORY
