name: Esse desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the desktop package version
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: macos
            arch: arm64
            runner: macos-15
          - platform: macos
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sidecars/agent
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecars/agent/package-lock.json
      - run: npm ci
      - name: Verify independent Esse tag
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - run: npm run typecheck
      - run: npm test
      - name: Resolve Windows signing mode
        if: matrix.platform == 'windows'
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $required = @(
            $env:WINDOWS_CERTIFICATE_PFX_BASE64,
            $env:WINDOWS_CERTIFICATE_PASSWORD
          )
          $configuredCount = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredCount -eq 0) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning 'Windows signing credentials are not configured. This release will contain unsigned Windows artifacts.'
          } elseif ($configuredCount -ne $required.Count) {
            throw 'Windows signing secrets must be configured together or all omitted.'
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Configure Windows Authenticode signing
        if: matrix.platform == 'windows' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'esse-authenticode.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve macOS signing mode
        if: matrix.platform == 'macos'
        id: macos-signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          required=(
            "$MACOS_CERTIFICATE_P12_BASE64"
            "$MACOS_CERTIFICATE_PASSWORD"
            "$MACOS_NOTARY_API_KEY_BASE64"
            "$MACOS_NOTARY_API_KEY_ID"
            "$MACOS_NOTARY_API_ISSUER_ID"
            "$MACOS_SIGN_IDENTITY"
          )
          configured_count=0
          for value in "${required[@]}"; do
            if [[ -n "$value" ]]; then configured_count=$((configured_count + 1)); fi
          done
          if [[ "$configured_count" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing credentials are not configured. This release will not be Developer ID signed or notarized."
          elif [[ "$configured_count" -ne "${#required[@]}" ]]; then
            echo "macOS signing and notarization secrets must be configured together or all omitted." >&2
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Developer ID signing and notarization
        if: matrix.platform == 'macos' && steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          certificate="$RUNNER_TEMP/esse-developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_API_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/esse-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$MACOS_NOTARY_API_KEY_BASE64" | /usr/bin/base64 -D > "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "MACOS_NOTARY_API_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_API_KEY_ID=$MACOS_NOTARY_API_KEY_ID" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_API_ISSUER_ID=$MACOS_NOTARY_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: npm run make
      - name: Verify Windows
        if: matrix.platform == 'windows'
        run: npm run verify:package:windows
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows' && steps.windows-signing.outputs.enabled == 'true'
        run: npm run verify:signatures
      - name: Verify unsigned Windows artifacts
        if: matrix.platform == 'windows' && steps.windows-signing.outputs.enabled == 'false'
        shell: pwsh
        run: |
          $product = Get-Content -Raw -Encoding UTF8 'product.json' | ConvertFrom-Json
          $targets = @(
            (Join-Path (Get-Location) ("out\{0}-win32-x64\{1}.exe" -f $product.displayName, $product.executableName)),
            (Join-Path (Get-Location) ("out\make\squirrel.windows\x64\{0}" -f $product.windowsSetupExe))
          )
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target)) { throw "Missing Windows release artifact: $target" }
            $status = (Get-AuthenticodeSignature -LiteralPath $target).Status
            if ($status -ne 'NotSigned') { throw "Expected unsigned Windows artifact but found signature status ${status}: $target" }
            Write-Output "$target is intentionally unsigned."
          }
      - name: Build macOS
        if: matrix.platform == 'macos'
        run: npm run make:macos:${{ matrix.arch }}
      - name: Verify signed and notarized macOS package
        if: matrix.platform == 'macos' && steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/verify-macos-bundle.sh ${{ matrix.arch }} --require-signed
      - name: Verify unsigned macOS package
        if: matrix.platform == 'macos' && steps.macos-signing.outputs.enabled == 'false'
        shell: bash
        run: bash scripts/verify-macos-bundle.sh ${{ matrix.arch }}
      - run: npm run stage:release -- ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: esse-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/esse-${{ matrix.platform }}-${{ matrix.arch }}-v*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: esse-*
          path: release
          merge-multiple: true
      - name: Create checksums and Sidecar metadata
        run: node scripts/create-private-release-metadata.mjs "$RELEASE_TAG"
      - name: Publish Esse release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Esse $RELEASE_TAG" \
            --notes-file .github/release-notes-prefix.md \
            "${prerelease[@]}"
