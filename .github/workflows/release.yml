name: Esse release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching the Esse Sidecar version
        required: true
        type: string

concurrency:
  group: esse-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      signing: ${{ steps.macos-signing.outputs.enabled }}
      commit: ${{ steps.identity.outputs.commit }}
    defaults:
      run:
        working-directory: sidecars/agent
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecars/agent/package-lock.json
      - name: Verify tag, ancestry, architecture and version-specific notes
        id: identity
        run: |
          test "$(uname -m)" = arm64
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          node ../../scripts/prepare-private-release-notes.mjs "$RELEASE_TAG" --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run e2e:thumbnails
      - name: Resolve macOS signing mode
        id: macos-signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          required=(
            "$MACOS_CERTIFICATE_P12_BASE64"
            "$MACOS_CERTIFICATE_PASSWORD"
            "$MACOS_NOTARY_API_KEY_BASE64"
            "$MACOS_NOTARY_API_KEY_ID"
            "$MACOS_NOTARY_API_ISSUER_ID"
            "$MACOS_SIGN_IDENTITY"
          )
          configured_count=0
          for value in "${required[@]}"; do
            if [[ -n "$value" ]]; then configured_count=$((configured_count + 1)); fi
          done
          if [[ "$configured_count" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing credentials are not configured. This release will use a verified ad-hoc app signature and will not be Developer ID signed or notarized."
          elif [[ "$configured_count" -ne "${#required[@]}" ]]; then
            echo "macOS signing and notarization secrets must be configured together or all omitted." >&2
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Developer ID signing and notarization
        if: steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          certificate="$RUNNER_TEMP/esse-developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_API_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/esse-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$MACOS_NOTARY_API_KEY_BASE64" | /usr/bin/base64 -D > "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "MACOS_NOTARY_API_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_API_KEY_ID=$MACOS_NOTARY_API_KEY_ID" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_API_ISSUER_ID=$MACOS_NOTARY_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build macOS ARM64
        run: npm run make:macos:arm64
      - name: Verify Developer ID signature and notarization
        if: steps.macos-signing.outputs.enabled == 'true'
        run: bash scripts/verify-macos-bundle.sh arm64 --require-signed
      - name: Verify ad-hoc signature and packaged app
        if: steps.macos-signing.outputs.enabled == 'false'
        run: bash scripts/verify-macos-bundle.sh arm64
      - run: npm run stage:release -- macos arm64
      - name: Bind staged asset to tag and commit
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: node scripts/create-private-release-provenance.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" macos arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: esse-release-macos-arm64-${{ steps.identity.outputs.commit }}
          path: |
            release/esse-macos-arm64-v*.dmg
            release/provenance-macos-arm64.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/esse-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/esse-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: esse-release-macos-arm64-${{ needs.package.outputs.commit }}
          path: release
      - name: Verify immutable build provenance
        env:
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          node scripts/verify-private-release-provenance.mjs "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Create checksums and Sidecar metadata
        run: node scripts/create-private-release-metadata.mjs "$RELEASE_TAG"
      - name: Prepare bilingual version-specific notes
        env:
          SIGNED: ${{ needs.package.outputs.signing }}
        run: node scripts/prepare-private-release-notes.mjs "$RELEASE_TAG" "$SIGNED"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-check.json" 2> "$RUNNER_TEMP/release-check.err"; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/release-check.err" || { cat "$RUNNER_TEMP/release-check.err" >&2; exit 1; }
          asset="$(node -p "require('./release/sidecar-latest.json').macosArm64Asset")"
          args=(release create "$RELEASE_TAG" "release/$asset" release/sidecar-latest.json release/checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Esse $RELEASE_TAG" --notes-file release/release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
