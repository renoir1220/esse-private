name: Esse desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: macos
            arch: arm64
            runner: macos-15
          - platform: macos
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sidecars/agent
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecars/agent/package-lock.json
      - run: npm ci
      - name: Verify independent Esse tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: npm run make
      - name: Verify Windows
        if: matrix.platform == 'windows'
        run: npm run verify:package:windows
      - name: Build macOS
        if: matrix.platform == 'macos'
        run: npm run make:macos:${{ matrix.arch }}
      - name: Verify macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/verify-macos-bundle.sh ${{ matrix.arch }}
      - run: npm run stage:release -- ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: esse-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/esse-${{ matrix.platform }}-${{ matrix.arch }}-v*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: esse-*
          path: release
          merge-multiple: true
      - name: Publish Esse release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Esse $GITHUB_REF_NAME" --generate-notes
